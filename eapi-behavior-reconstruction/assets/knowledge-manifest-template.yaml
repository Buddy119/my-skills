pack_format_version: 2
repository: "repository-name"
source_commit: "git-commit-or-unknown"
analysis_mode: "automatic|targeted"
coverage_status: "complete|partial|blocked"
documents:
  claim_ledger: ".work/claim-ledger.json"
  claim_audit: ".work/claim-audit.json"
  knowledge_map: "knowledge-map.md"
  coverage_report: "coverage-report.md"
  tech_overview: "tech-pack/repository-overview.md"
  behavior_catalog: "tech-pack/behavior-catalog.yaml"
  endpoint_matrix: "tech-pack/endpoints/endpoint-matrix.md"
  data_asset_catalog: "tech-pack/data/data-asset-catalog.md"
  data_lineage: "tech-pack/data/data-lineage.md"
  state_transition_matrix: "tech-pack/data/state-transition-matrix.md"
  field_catalog: "tech-pack/fields/field-catalog.md"
  validation_rule_matrix: "tech-pack/fields/validation-rule-matrix.md"
  field_lineage: "tech-pack/fields/field-lineage.md"
  external_http_mapping_matrix: "tech-pack/fields/external-http-mapping-matrix.md"
  runtime_config_matrix: "tech-pack/runtime/runtime-config-matrix.md"
  dependency_matrix: "tech-pack/dependencies/dependency-matrix.md"
  failure_taxonomy: "tech-pack/reliability/failure-taxonomy.md"
  ba_overview: "ba-pack/business-overview.md"
  ba_capability_map: "ba-pack/capability-map.md"
  ba_data_lifecycle: "ba-pack/business-data-lifecycle.md"
  ba_rule_catalog: "ba-pack/business-rule-catalog.md"
  ba_exception_catalog: "ba-pack/business-exception-catalog.md"
  ba_behavior_catalog: "ba-pack/behavior-catalog.md"

# Required behavior keys: behavior_id, category, status, document, ba_document,
# tech_flow_model, ba_flow_model, duplicate_of, claim_ids, endpoint_ids,
# data_asset_ids, field_ids, dependency_ids, config_ids, failure_ids.
behaviors: []

# Required endpoint keys: endpoint_id, method, route, status,
# primary_behavior_id, behavior_ids, contract_document, contract_alias_of, claim_ids.
endpoints: []

# Required data-asset keys: data_asset_id, kind, name, status, behavior_ids, claim_ids.
data_assets: []

# Required field keys: field_id, boundary_id, boundary_kind, observation_kind,
# path, status, validation_rule_ids, claim_ids. A local lookup key is not an
# external response-contract field.
# boundary_kind: inbound-api|outbound-http-request|outbound-http-response|event|
# persistence|dependency-call|local-input|local-result|local-lookup|unknown.
# observation_kind: declared-contract-field|schema-field|executable-boundary-read|
# executable-boundary-write|local-lookup-key|local-result|inferred-field|unknown.
fields: []

# Required validation-rule keys: rule_id, status, behavior_ids, field_ids, failure_ids, claim_ids.
validation_rules: []

# Required dependency keys: dependency_id, type, material, status, stub_document,
# behavior_ids, endpoint_ids, config_ids, failure_ids, claim_ids.
dependencies: []

# Required config keys: config_id, key, category, status, behavior_ids,
# endpoint_ids, dependency_ids, failure_ids, claim_ids.
configs: []

# Required failure keys: failure_id, category, status, behavior_ids,
# endpoint_ids, dependency_ids, config_ids, claim_ids.
failures: []

# Required HTTP-call keys: call_id, dependency_id, status, behavior_ids,
# config_ids, failure_ids, claim_ids.
external_http_calls: []

# Required mapping keys: mapping_id, call_id, direction, status, field_ids, claim_ids.
field_mappings: []

summary:
  behaviors: 0
  endpoints: 0
  data_assets: 0
  fields: 0
  validation_rules: 0
  dependencies: 0
  configs: 0
  failures: 0
  external_http_calls: 0
  field_mappings: 0
